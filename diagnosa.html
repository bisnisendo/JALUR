<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Diagnosa koneksi · JALUR</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;max-width:680px;margin:24px auto;padding:0 16px;color:#111}
  li{margin:8px 0;list-style:none}
  .ok{color:#15803d}.no{color:#b91c1c}.in{color:#6b7280}
  small{display:block;color:#6b7280}
</style>
</head>
<body>
<h2>Diagnosa koneksi Supabase</h2>
<ul id="o"></ul>
<p><a href="index.html">← Kembali ke aplikasi</a></p>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
(async function () {
  var C = window.JALUR_CONFIG || {}, out = document.getElementById("o");
  function add(cls, text, hint) {
    var li = document.createElement("li"), s = document.createElement("span");
    s.className = cls; s.textContent = (cls === "ok" ? "✓ " : cls === "no" ? "✗ " : "• ") + text;
    li.appendChild(s);
    if (hint) { var h = document.createElement("small"); h.textContent = hint; li.appendChild(h); }
    out.appendChild(li);
  }

  window.supabase ? add("ok", "Library supabase-js termuat") : add("no", "Library supabase-js gagal dimuat", "Periksa koneksi internet.");
  var cfgOk = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY);
  cfgOk ? add("ok", "config.js terisi (URL dan key)") : add("no", "SUPABASE_URL / SUPABASE_ANON_KEY belum diisi di js/config.js");
  if (!window.db) { add("no", "Koneksi db belum dibuat", "Lihat console browser (F12) untuk pesan error."); return; }

  try {
    var h = await fetch(C.SUPABASE_URL.replace(/\/+$/, "") + "/auth/v1/health", { headers: { apikey: C.SUPABASE_ANON_KEY } });
    h.ok ? add("ok", "Server Supabase bisa dijangkau") : add("no", "Server Supabase menjawab " + h.status, "Periksa URL dan key di config.js.");
  } catch (e) { add("no", "Server Supabase tidak bisa dijangkau", String(e.message || e)); return; }

  var s = (await db.auth.getSession()).data.session;
  if (!s) { add("in", "Belum login", "Masuk dulu lewat halaman utama (tab ini berbagi sesi dengan aplikasi), lalu buka diagnosa lagi untuk tes tabel dan file."); return; }
  add("ok", "Sudah login sebagai " + (s.user.email || s.user.id));

  var p = await db.from("profiles").select("username,nama,role").eq("id", s.user.id).maybeSingle();
  if (p.error) add("no", "Tabel profiles gagal dibaca", p.error.message + " — sudah menjalankan supabase/setup.sql?");
  else if (!p.data) add("no", "Akun ini belum ada di tabel profiles", "Jalankan bagian 5 di supabase/setup.sql.");
  else add("ok", "Profil: " + p.data.nama + " (" + p.data.role + ")");

  var a = await db.from("app_state").select("updated_at,data").eq("id", 1).maybeSingle();
  if (a.error) add("no", "Tabel app_state gagal dibaca", a.error.message);
  else if (!a.data) add("in", "Tabel app_state masih kosong", "Normal untuk pertama kali. Admin akan diminta mengunggah data saat masuk.");
  else add("ok", "Data aplikasi ada di server (" + Object.keys(a.data.data || {}).length + " kelompok data)", "Terakhir diubah: " + a.data.updated_at);

  var b = await db.storage.from("penawaran").list("", { limit: 1 });
  b.error ? add("no", "Bucket 'penawaran' bermasalah", b.error.message + " — jalankan bagian 3 di supabase/setup.sql.") : add("ok", "Bucket 'penawaran' siap");
})();
</script>
</body>
</html>
